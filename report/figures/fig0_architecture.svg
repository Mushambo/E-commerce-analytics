<text x="44" y="253" font-size="15" font-weight="700" fill="#ffffff">1. Data generation</text>
<text x="46" y="288" font-size="13.5" fill="#2f2e2b" text-anchor="start">dataset_generator.py</text>
<text x="46" y="307" font-size="13.5" fill="#2f2e2b" text-anchor="start">(seeded, streamed, --scale)</text>
<text x="46" y="345" font-size="13.5" fill="#2f2e2b" text-anchor="start">users.json</text>
<text x="46" y="364" font-size="13.5" fill="#2f2e2b" text-anchor="start">products.json</text>
<text x="46" y="383" font-size="13.5" fill="#2f2e2b" text-anchor="start">categories.json</text>
<text x="46" y="402" font-size="13.5" fill="#2f2e2b" text-anchor="start">transactions.json</text>
<text x="46" y="421" font-size="13.5" fill="#2f2e2b" text-anchor="start">sessions_0..N.json</text>
<rect x="380" y="80" width="390" height="270" rx="10" fill="#eaf6ee" stroke="#1f8a4c" stroke-width="2"/>
<rect x="380" y="80" width="390" height="34" rx="10" fill="#1f8a4c"/><rect x="380" y="100" width="390" height="14" fill="#1f8a4c"/>
<text x="394" y="103" font-size="15" font-weight="700" fill="#ffffff">MongoDB  ·  document store</text>
<text x="396" y="138" font-size="13.5" fill="#2f2e2b" text-anchor="start">categories  - subcategories embedded</text>
<text x="396" y="157" font-size="13.5" fill="#2f2e2b" text-anchor="start">products  - extended ref + price_history</text>
<text x="396" y="176" font-size="13.5" fill="#2f2e2b" text-anchor="start">transactions  - line items embedded</text>
<text x="396" y="195" font-size="13.5" fill="#2f2e2b" text-anchor="start">users  - computed purchase_summary</text>
<text x="396" y="214" font-size="13.5" fill="#2f2e2b" text-anchor="start">sessions  - sample of full journeys</text>
<text x="396" y="252" font-size="13.5" fill="#2f2e2b" text-anchor="start">Indexes: user_id+timestamp, timestamp,</text>
<text x="396" y="271" font-size="13.5" fill="#2f2e2b" text-anchor="start">items.product_id, total_spent</text>
<rect x="380" y="380" width="390" height="200" rx="10" fill="#fbecea" stroke="#b8322b" stroke-width="2"/>
<rect x="380" y="380" width="390" height="34" rx="10" fill="#b8322b"/><rect x="380" y="400" width="390" height="14" fill="#b8322b"/>
<text x="394" y="403" font-size="15" font-weight="700" fill="#ffffff">HBase  ·  wide-column store</text>
<text x="396" y="438" font-size="13.5" fill="#2f2e2b" text-anchor="start" font-weight="600">user_sessions</text>
<text x="396" y="457" font-size="13.5" fill="#2f2e2b" text-anchor="start">key: user_id | reverse_ts | session_id</text>
<text x="396" y="476" font-size="13.5" fill="#2f2e2b" text-anchor="start">CF: info · pv · cart</text>
<text x="396" y="514" font-size="13.5" fill="#2f2e2b" text-anchor="start" font-weight="600">product_metrics</text>
<text x="396" y="533" font-size="13.5" fill="#2f2e2b" text-anchor="start">key: product_id | yyyymmdd   CF: m</text>
<rect x="380" y="610" width="390" height="100" rx="10" fill="#f4f4f2" stroke="#6b6a66" stroke-width="2"/>
<rect x="380" y="610" width="390" height="34" rx="10" fill="#6b6a66"/><rect x="380" y="630" width="390" height="14" fill="#6b6a66"/>
<text x="394" y="633" font-size="15" font-weight="700" fill="#ffffff">Parquet data lake  (data/clean)</text>
<text x="396" y="668" font-size="13.5" fill="#2f2e2b" text-anchor="start">9 clean tables, Snappy, partitioned by date</text>
<rect x="885" y="125" width="370" height="62" rx="10" fill="#ffffff" stroke="#d9601a" stroke-width="2"/>
<text x="899" y="147" font-size="14.5" font-weight="700" fill="#d9601a" text-anchor="start">01  clean &amp; normalise</text>
<text x="899" y="167" font-size="12.5" fill="#2f2e2b" text-anchor="start">explicit schemas · dedupe · repair · flag</text>
<rect x="885" y="200" width="370" height="50" rx="10" fill="#ffffff" stroke="#d9601a" stroke-width="2"/>
<text x="899" y="222" font-size="14.5" font-weight="700" fill="#d9601a" text-anchor="start">02  recommendations</text>
<text x="899" y="242" font-size="12.5" fill="#2f2e2b" text-anchor="start">bought / viewed together, lift</text>
<rect x="885" y="263" width="370" height="50" rx="10" fill="#ffffff" stroke="#d9601a" stroke-width="2"/>
<text x="899" y="285" font-size="14.5" font-weight="700" fill="#d9601a" text-anchor="start">03  cohort analysis</text>
<text x="899" y="305" font-size="12.5" fill="#2f2e2b" text-anchor="start">registration-month retention</text>
<rect x="885" y="326" width="370" height="50" rx="10" fill="#ffffff" stroke="#d9601a" stroke-width="2"/>
<text x="899" y="348" font-size="14.5" font-weight="700" fill="#d9601a" text-anchor="start">04  Spark SQL</text>
<text x="899" y="368" font-size="12.5" fill="#2f2e2b" text-anchor="start">windows, ROLLUP, Mongo/HBase-shaped joins</text>
<rect x="885" y="410" width="370" height="70" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
