<text x="1165.0" y="598" font-size="12.5" fill="#2f2e2b" text-anchor="middle">(HBase)</text>
<text x="1165.0" y="615" font-size="12.5" fill="#2f2e2b" text-anchor="middle">+ purchases</text>
